<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Date Search</title>
  <style>
    :root {
      --bg: #0c0e14;
      --surface: #141822;
      --surface-subtle: #0f121a;
      --border: #202636;
      --border-hover: #313a52;
      --border-focus: #4b5d82;
      --text: #e2e8f0;
      --text-muted: #8b97ab;
      --text-dim: #546075;
      --accent: #334e68;
      --accent-hover: #3e5e7e;
      --highlight-bg: #222d3d;
      --highlight-border: #485c7b;
      --highlight-text: #f8fafc;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Consolas, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 48px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .status-tag {
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 4px;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    /* Input Section */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 90px;
    }

    .field-year {
      flex: 1.4;
      min-width: 110px;
    }

    .field-format {
      flex: 1.6;
      min-width: 140px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dim);
    }

    input, select {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 15px;
      padding: 9px 12px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--border-focus);
    }

    select {
      font-family: var(--font-sans);
      font-size: 13px;
      cursor: pointer;
    }

    .btn-search {
      background: var(--accent);
      border: 1px solid var(--border-hover);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      padding: 9px 24px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      height: 40px;
      white-space: nowrap;
    }

    .btn-search:hover {
      background: var(--accent-hover);
      border-color: var(--border-focus);
    }

    .btn-search:active {
      transform: translateY(1px);
    }

    .btn-search:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Sub-row: query preview & examples */
    .helper-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-dim);
      padding-top: 4px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
    }

    .query-preview {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .query-val {
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 12px;
    }

    .examples {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .example-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.15s;
      padding: 0;
    }

    .example-btn:hover {
      color: var(--text);
    }

    /* Stream Section */
    .stream-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stream-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .stream-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-control {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-control:hover {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-hover);
    }

    .stream-window {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      min-height: 140px;
      max-height: 180px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 14px;
      line-height: 1.8;
      letter-spacing: 2px;
      word-break: break-all;
      color: var(--text-muted);
    }

    .prefix-pi {
      color: var(--text);
      font-weight: 600;
      margin-right: 2px;
    }

    .match-highlight {
      background: var(--highlight-bg);
      border: 1px solid var(--highlight-border);
      color: var(--highlight-text);
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 600;
    }

    /* Result Card */
    .result-card {
      display: none;
      flex-direction: column;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border-focus);
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .result-main {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .position-number {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .position-label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .tape-box {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      color: var(--text-dim);
      word-break: break-all;
      line-height: 1.6;
    }

    .tape-box .match {
      color: var(--text);
      font-weight: 600;
      background: var(--highlight-bg);
      border: 1px solid var(--highlight-border);
      padding: 1px 6px;
      border-radius: 3px;
      margin: 0 2px;
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border-focus);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 6px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.2s ease;
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-row">
        <h1>Pi Date Search</h1>
        <span id="index-stat" class="status-tag">250,000 local · 200M indexed</span>
      </div>
      <p class="subtitle">Find the exact decimal position of any date within the digits of π.</p>
    </header>

    <!-- Date Input Form -->
    <div class="card">
      <div class="input-form">
        <div class="form-row">
          <div class="field">
            <label for="in-day">Day</label>
            <input type="number" id="in-day" min="1" max="31" value="14" oninput="updateTarget()" onkeydown="handleKey(event)">
          </div>
          <div class="field">
            <label for="in-month">Month</label>
            <input type="number" id="in-month" min="1" max="12" value="3" oninput="updateTarget()" onkeydown="handleKey(event)">
          </div>
          <div class="field field-year">
            <label for="in-year">Year</label>
            <input type="number" id="in-year" min="1800" max="2100" value="1879" oninput="updateTarget()" onkeydown="handleKey(event)">
          </div>
          <div class="field field-format">
            <label for="in-format">Format</label>
            <select id="in-format" onchange="updateTarget()">
              <option value="DDMMYYYY" selected>DD/MM/YYYY</option>
              <option value="MMDDYYYY">MM/DD/YYYY</option>
              <option value="YYYYMMDD">YYYY/MM/DD</option>
              <option value="DDMMYY">DD/MM/YY</option>
              <option value="DDMM">DD/MM</option>
            </select>
          </div>
          <button id="btn-search" class="btn-search" onclick="runSearch()">Search</button>
        </div>

        <div class="helper-row">
          <div class="query-preview">
            <span>Query:</span>
            <span id="query-display" class="query-val">14031879</span>
          </div>
          <div class="examples">
            <span>Examples:</span>
            <button class="example-btn" onclick="setPreset(14, 3, 1879, 'DDMMYYYY')">Pi Day 1879</button>
            <span>·</span>
            <button class="example-btn" onclick="setPreset(20, 7, 1969, 'DDMMYYYY')">Apollo 11</button>
            <span>·</span>
            <button class="example-btn" onclick="setPreset(12, 3, 1989, 'DDMMYYYY')">Web 1989</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Live Digits Stream -->
    <div class="card stream-card">
      <div class="stream-header">
        <span class="stream-label">Digits of π</span>
        <div class="stream-controls">
          <span id="offset-indicator" style="font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); margin-right: 6px;">Offset: 1</span>
          <button id="btn-stream" class="btn-control" onclick="toggleStream()">Pause</button>
          <button class="btn-control" onclick="resetStream()">Reset</button>
        </div>
      </div>
      <div id="stream-box" class="stream-window">
        <span class="prefix-pi">3.</span><span id="stream-content">Loading digits...</span>
      </div>
    </div>

    <!-- Result Box -->
    <div id="result-card" class="card result-card">
      <div class="result-title-row">
        <span class="result-title">Result Found</span>
        <span id="result-source" style="font-size: 11.5px; color: var(--text-dim); font-family: var(--font-mono);">200M Index</span>
      </div>

      <div class="result-main">
        <span id="result-pos" class="position-number">11,885,022</span>
        <span class="position-label">digits into π</span>
      </div>

      <div class="tape-box">
        <span id="tape-before">...984510382947</span>
        <span id="tape-matched" class="match">14031879</span>
        <span id="tape-after">492048591823...</span>
      </div>

      <div class="result-actions">
        <button class="btn-control" onclick="copyPosition()">Copy position</button>
        <button class="btn-control" onclick="copyContext()">Copy sequence</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard</div>

  <script>
    let targetQuery = '14031879';
    let piDigits = '';
    let streamIndex = 0;
    let isStreaming = true;
    let streamTimer = null;

    let currentResult = {
      position: 11885022,
      before: '984510382947',
      matched: '14031879',
      after: '492048591823',
      source: 'Pi 200M Index'
    };

    function updateTarget() {
      const d = String(Math.max(1, Math.min(31, parseInt(document.getElementById('in-day').value) || 1))).padStart(2, '0');
      const m = String(Math.max(1, Math.min(12, parseInt(document.getElementById('in-month').value) || 1))).padStart(2, '0');
      const y = String(parseInt(document.getElementById('in-year').value) || 2000).padStart(4, '0');
      const fmt = document.getElementById('in-format').value;

      let q = '';
      if (fmt === 'DDMMYYYY') q = d + m + y;
      else if (fmt === 'MMDDYYYY') q = m + d + y;
      else if (fmt === 'YYYYMMDD') q = y + m + d;
      else if (fmt === 'DDMMYY') q = d + m + y.slice(-2);
      else if (fmt === 'DDMM') q = d + m;
      else q = d + m + y;

      targetQuery = q;
      document.getElementById('query-display').innerText = q;
    }

    function setPreset(d, m, y, fmt) {
      document.getElementById('in-day').value = d;
      document.getElementById('in-month').value = m;
      document.getElementById('in-year').value = y;
      document.getElementById('in-format').value = fmt;
      updateTarget();
    }

    function handleKey(e) {
      if (e.key === 'Enter') runSearch();
    }

    // Load Pi Digits
    async function initDigits() {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.get_local_digits) {
        try {
          const res = await window.pywebview.api.get_local_digits(250000);
          if (res && res.length > 500) {
            piDigits = res;
            startStreaming();
            return;
          }
        } catch (e) {}
      }

      try {
        const resp = await fetch('pi_100k.txt');
        if (resp.ok) {
          piDigits = await resp.text();
          startStreaming();
          return;
        }
      } catch (e) {}

      try {
        const resp2 = await fetch('pi_10k.txt');
        if (resp2.ok) {
          piDigits = await resp2.text();
          startStreaming();
          return;
        }
      } catch (e) {}

      piDigits = "1415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091";
      startStreaming();
    }

    function renderSlice(start, highlight = null) {
      if (!piDigits) return;
      const count = 350;
      const slice = piDigits.substr(start, count);

      if (highlight && highlight.start >= start && highlight.start < start + count) {
        const matchRel = highlight.start - start;
        const before = slice.substring(0, matchRel);
        const match = slice.substring(matchRel, matchRel + targetQuery.length);
        const after = slice.substring(matchRel + targetQuery.length);
        document.getElementById('stream-content').innerHTML = `${before}<span class="match-highlight">${match}</span>${after}`;
      } else {
        document.getElementById('stream-content').innerText = slice;
      }

      document.getElementById('offset-indicator').innerText = `Offset: ${(start + 1).toLocaleString()}`;
    }

    function startStreaming() {
      if (streamTimer) clearInterval(streamTimer);
      renderSlice(0);
      streamTimer = setInterval(() => {
        if (!isStreaming || !piDigits) return;
        streamIndex += 4;
        if (streamIndex >= piDigits.length - 350) streamIndex = 0;
        renderSlice(streamIndex);
      }, 120);
    }

    function toggleStream() {
      isStreaming = !isStreaming;
      document.getElementById('btn-stream').innerText = isStreaming ? 'Pause' : 'Resume';
    }

    function resetStream() {
      streamIndex = 0;
      renderSlice(0);
      showToast('Rewound to digit 1');
    }

    // Search
    async function runSearch() {
      const btn = document.getElementById('btn-search');
      btn.innerText = 'Searching...';
      btn.disabled = true;

      let res = null;

      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.search_pi) {
          res = await window.pywebview.api.search_pi(targetQuery);
        } else {
          const localPos = piDigits.indexOf(targetQuery);
          if (localPos !== -1) {
            const startCtx = Math.max(0, localPos - 12);
            const endCtx = Math.min(piDigits.length, localPos + targetQuery.length + 12);
            res = {
              success: true,
              position: localPos + 1,
              before: piDigits.substring(startCtx, localPos),
              matched: targetQuery,
              after: piDigits.substring(localPos + targetQuery.length, endCtx),
              source: 'Local Cache'
            };
          } else {
            const resp = await fetch("https://www.angio.net/newpi/piquery", {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: "q=" + targetQuery
            });
            const data = await resp.json();
            if (data.r && data.r[0] && data.r[0].p) {
              const item = data.r[0];
              res = {
                success: true,
                position: item.p,
                before: item.db || '...',
                matched: targetQuery,
                after: item.da || '...',
                source: 'Pi 200M Index'
              };
            } else {
              res = { success: false, error: 'Not found in the first 200 million digits.' };
            }
          }
        }
      } catch (err) {
        res = { success: false, error: 'Search failed: ' + err };
      }

      btn.innerText = 'Search';
      btn.disabled = false;

      if (res && res.success) {
        currentResult = res;
        showResult(res);
        if (res.position <= piDigits.length) {
          streamIndex = Math.max(0, res.position - 15);
          renderSlice(streamIndex, { start: res.position - 1 });
        }
      } else {
        showToast(res ? res.error : 'Not found');
      }
    }

    function showResult(res) {
      const card = document.getElementById('result-card');
      card.style.display = 'flex';
      document.getElementById('result-pos').innerText = Number(res.position).toLocaleString();
      document.getElementById('result-source').innerText = res.source || '200M Index';
      document.getElementById('tape-before').innerText = '...' + (res.before || '');
      document.getElementById('tape-matched').innerText = res.matched;
      document.getElementById('tape-after').innerText = (res.after || '') + '...';
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function copyPosition() {
      navigator.clipboard.writeText(String(currentResult.position));
      showToast('Position copied to clipboard');
    }

    function copyContext() {
      const text = `...${currentResult.before} [${currentResult.matched}] ${currentResult.after}... at position #${currentResult.position.toLocaleString()}`;
      navigator.clipboard.writeText(text);
      showToast('Sequence details copied');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    updateTarget();
    initDigits();
  </script>
</body>
</html>
